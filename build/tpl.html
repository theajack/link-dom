    <script>
        // 获取 query.file
        const query = window.location.search;
        let file = query.match(/file=(.*)/)[1];
        const script = document.createElement('script');
        if(file.startsWith('/jsbox')) {
            script.src = `.${file.replace('/jsbox', '/jsbox-demo')}`;
        }else{
            script.src = `./demo${file}`;
        }
        script.type = 'module';
        document.head.appendChild(script);
    </script>
    <div id="app"></div>
    <div id="jx-app"></div>
    <script type="module" src="./demo/index.ts"></script>
